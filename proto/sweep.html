<meta charset="utf-8">
<title>Sweep lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --ink:#07090a; --line:#1e2422; --line-2:#161b19;
    --bone:#f2f6ec; --chalk:#dfe6d8; --ash:#9aa694; --muted:#7c8878; --dim:#5a6356;
    --lime:#c6f24e;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink); color:var(--chalk); font-family:var(--mono);
       overflow:hidden; user-select:none; -webkit-user-select:none}
  #gl{position:fixed; inset:0; width:100%; height:100%; display:block}
  .tile{position:fixed; pointer-events:auto; cursor:pointer;
        border:1px solid var(--line-2); transition:border-color .18s ease}
  .tile:hover{border-color:var(--lime)}
  .tag{position:absolute; left:14px; top:12px; pointer-events:none; font-size:11px;
       letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
  .name{position:absolute; left:14px; top:30px; pointer-events:none; font-size:15px; color:var(--bone)}
  .desc{position:absolute; left:14px; bottom:26px; right:14px; pointer-events:none;
        font-size:11.5px; line-height:1.55; color:var(--muted); max-width:46ch;
        opacity:0; transition:opacity .2s ease}
  .tile:hover .desc, .tile.focus .desc{opacity:1}
  .bar{position:absolute; left:14px; right:14px; bottom:14px; height:1px;
       background:var(--line-2); pointer-events:none}
  .bar i{position:absolute; inset:0 auto 0 0; background:var(--lime); width:0}
  .tile.row .tag{top:14px}
  .tile.row .name{top:32px; font-size:14px; max-width:118px; line-height:1.25}
  .tile.row .desc, .tile.row .bar{display:none}
  .tile.row{border-left:none; border-right:none}
  #hud{position:fixed; left:0; right:0; bottom:0; padding:10px 16px; display:flex;
       gap:18px; align-items:center; flex-wrap:wrap; font-size:11.5px; color:var(--dim);
       letter-spacing:.06em; pointer-events:none;
       background:linear-gradient(0deg,rgba(7,9,10,.94),rgba(7,9,10,0))}
  kbd{font:inherit; border:1px solid var(--line); border-radius:4px; padding:1px 5px; color:var(--ash)}
  #err{position:fixed; inset:0; display:none; place-items:center; padding:40px; color:var(--ash)}
</style>

<canvas id="gl"></canvas>
<div id="hud">
  <span>clay arrives from the lit orb · glass leaves at the dark slot</span>
  <span><kbd>1</kbd>–<kbd>4</kbd> focus · <kbd>0</kbd> grid · <kbd>F</kbd> filmstrip</span>
  <span><kbd>R</kbd> replay · <kbd>space</kbd> pause · <kbd>S</kbd> slow</span>
</div>
<div id="err">This prototype needs WebGL2.</div>

<script type="module">
/* ───────────────────────────────────────────────────────────────────────────
   sweep lab

   Four ways to relate the material change to the ring it is caused by.

   The complaint that produced this: the change looks like an animation
   playing on a static ball while the orbs orbit past, unrelated. The numbers
   agree. Over one exchange the ring turns 11 degrees and the anchor the drain
   contracts onto moves 6, while the entry and the exit are 110 degrees apart
   on the body. So the change travels a long way around a surface, and almost
   nothing about where it travels has anything to do with where the orbs are.

   The ring cannot simply carry the front: at five degrees a second it would
   need twenty-two seconds to cover that arc, and the exchange lasts two.
   What it can do is decide where the front is, from moment to moment, out of
   the live positions of the two orbs involved rather than out of a direction
   sampled once.
   ─────────────────────────────────────────────────────────────────────── */

const VERT = `#version 300 es
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec4  uTile;
uniform float uHostR;
uniform vec3  uInPos;     // the arriving drop
uniform float uInR;
uniform float uInK;
uniform vec3  uOutPos;    // the departing one
uniform float uOutR;
uniform float uOutK;
uniform vec3  uFrontC;    // centre of what is still the old material
uniform float uFrontR;
uniform vec3  uOrb[6];    // the ring, drawn rather than fused
uniform float uOrbR[6];
uniform int   uHot;       // which ring slot is the one arriving, -1 for none

float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float map(vec3 p){
  float d = length(p) - uHostR;
  if (uInR  > 0.001) d = smin(d, length(p - uInPos)  - uInR,  uInK);
  if (uOutR > 0.001) d = smin(d, length(p - uOutPos) - uOutR, uOutK);
  return d;
}
vec3 normalAt(vec3 p){
  const vec2 e = vec2(1.0, -1.0) * 0.0016;
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) +
                   e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

vec3 env(vec3 d){
  vec3 c = mix(vec3(0.010, 0.013, 0.013), vec3(0.032, 0.038, 0.033),
               smoothstep(-0.6, 0.9, d.y));
  c += vec3(1.00, 0.98, 0.93) * pow(max(dot(d, normalize(vec3(-0.42, 0.70, 0.45))), 0.0), 90.0) * 11.0;
  c += vec3(0.38, 0.52, 0.70) * pow(max(dot(d, normalize(vec3( 0.82, 0.12, 0.30))), 0.0), 34.0) * 1.6;
  c += vec3(0.78, 0.95, 0.31) * pow(max(dot(d, normalize(vec3( 0.30, 0.10,-0.92))), 0.0), 55.0) * 7.0;
  return c;
}
vec3 backdrop(vec3 rd){
  return mix(vec3(0.020, 0.024, 0.025), vec3(0.030, 0.035, 0.032),
             smoothstep(0.75, -0.55, rd.y)) * 0.55;
}
vec3 shadeGlass(vec3 n, vec3 rd){
  float F = 0.04 + 0.96 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
  vec3 refr = refract(rd, n, 1.0 / 1.52);
  return mix((backdrop(refr) * 1.9 + env(refr) * 0.22) * 0.8,
             env(reflect(rd, n)), clamp(F * 2.4, 0.03, 1.0)) * 1.15;
}
vec3 shadeClay(vec3 n, vec3 rd){
  float lam = max(dot(n, normalize(vec3(-0.42, 0.68, 0.55))), 0.0);
  vec3 col = vec3(0.44, 0.26, 0.17) * (0.10 + 0.72 * lam);
  col += env(reflect(rd, n)) * 0.045;
  col += vec3(0.78, 0.95, 0.31) * pow(1.0 - max(dot(n, -rd), 0.0), 3.0) * 0.16;
  return col;
}
vec3 shadeOrb(vec3 n, vec3 rd, float hot){
  vec3 base = mix(vec3(0.30, 0.33, 0.32), vec3(0.44, 0.26, 0.17), hot);
  float lam = max(dot(n, normalize(vec3(-0.42, 0.68, 0.55))), 0.0);
  vec3 col = base * (0.12 + 0.55 * lam) + env(reflect(rd, n)) * 0.5;
  col += vec3(0.78, 0.95, 0.31) * pow(1.0 - max(dot(n, -rd), 0.0), 3.0) * 0.30;
  return col * 1.35;
}

void main(){
  vec2 frag = gl_FragCoord.xy - uTile.xy;
  vec2 uv = (frag - 0.5 * uTile.zw) / uTile.w;

  vec3 ro = vec3(0.0, 0.95, 5.6);
  vec3 fw = normalize(vec3(0.0, 0.0, 0.0) - ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.65 * fw);

  vec3 col = backdrop(rd);
  float best = 1e9;
  int hitOrb = -1;

  // the ring: analytic spheres, nearest wins
  for (int i = 0; i < 6; i++){
    if (uOrbR[i] < 0.01) continue;
    vec3 oc = ro - uOrb[i];
    float b = dot(oc, rd), c = dot(oc, oc) - uOrbR[i] * uOrbR[i];
    float h = b * b - c;
    if (h < 0.0) continue;
    float t = -b - sqrt(h);
    if (t > 0.05 && t < best){ best = t; hitOrb = i; }
  }

  // the body
  float t = 0.0, hit = 0.0;
  {
    float b = dot(ro, rd), c = dot(ro, ro) - 16.0;
    float h = b * b - c;
    t = h > 0.0 ? max(0.0, -b - sqrt(h)) : 1e9;
  }
  for (int i = 0; i < 110; i++){
    if (t > 12.0 || t > best) break;
    vec3 p = ro + rd * t;
    float d = map(p);
    if (d < 0.0009 * t){ hit = 1.0; break; }
    t += d * 0.80;
  }

  if (hit > 0.5 && t < best){
    vec3 p = ro + rd * t;
    vec3 n = normalAt(p);
    // inside the front is still the old material; the arriving drop is exempt
    bool inDrop = uInR > 0.001 && length(p - uInPos) < uInR * 1.2;
    bool old = !inDrop && uFrontR > 0.0 && length(p - uFrontC) < uFrontR;
    col = old ? shadeGlass(n, rd) : shadeClay(n, rd);
  } else if (hitOrb >= 0){
    vec3 p = ro + rd * best;
    col = shadeOrb(normalize(p - uOrb[hitOrb]), rd, hitOrb == uHot ? 1.0 : 0.0);
  }

  col = col / (col + 0.86);
  col = pow(max(col, 0.0), vec3(1.0 / 2.2));
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
  fragColor = vec4(col, 1.0);
}`;

/* ── the scene ───────────────────────────────────────────────────────── */

const R0 = 0.88, RB = 0.30, RING = 2.25, TILT = 0.34, ORB_R = 0.24;
const SPIN = 0.085;                    // rad/s, the rate the site uses
const N = 6;
/* Two slots apart, not three. Three is diametrically opposite, which puts
   the last of the old material on the far side of the body where the camera
   cannot see it: the drain finishes out of shot and the change looks like it
   simply stopped. Worth knowing for the real ring too, where the pair is
   whatever the visitor happened to click. */
const IN_SLOT = 1, OUT_SLOT = 3;

const c01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const mix = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);
const norm = (v) => { const l = Math.hypot(...v) || 1; return v.map((x) => x / l); };

const slotDir = (k, spin) => {
  const a = spin + (Math.PI * 2 * k) / N;
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  const x = Math.cos(a), z = Math.sin(a);
  return norm([x, -z * st, z * ct]);
};

/* Rotate from a toward b by fraction f, along the arc between them, which is
   what "follow the orbs" has to mean once you notice the ring itself is far
   too slow to carry anything. */
function slerp(a, b, f){
  let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  d = Math.max(-1, Math.min(1, d));
  const th = Math.acos(d);
  if (th < 1e-4) return [...a];
  const s = Math.sin(th);
  const wa = Math.sin((1 - f) * th) / s, wb = Math.sin(f * th) / s;
  return [a[0] * wa + b[0] * wb, a[1] * wa + b[1] * wb, a[2] * wa + b[2] * wb];
}

const T_TOUCH = 0.26, T_EATEN = 0.44, T_PUSH = 0.58, T_PART = 0.86;

/* Motion is the same in all four. Only the rule that places the front differs. */
function scene(t, spin){
  const inD = slotDir(IN_SLOT, spin), outD = slotDir(OUT_SLOT, spin);
  const contact = R0 + RB * 0.92, apart = R0 + RB + 0.04;
  const s = {
    inPos: [0, 0, 0], inR: 0, inK: 0.02,
    outPos: [0, 0, 0], outR: 0, outK: 0.02,
    orbs: [], orbR: [], hot: -1, inD, outD, inDist: RING, outDist: 0,
  };

  if (t < T_EATEN){
    let d, r;
    if (t < T_TOUCH){ d = mix(RING, contact, smoother(t / T_TOUCH)); r = RB; }
    else { const q = c01((t - T_TOUCH) / (T_EATEN - T_TOUCH));
           d = mix(contact, R0 * 0.2, easeIO(q)); r = RB * Math.cbrt(Math.max(0, 1 - q)); }
    s.inPos = inD.map((x) => x * d); s.inR = r; s.inDist = d;
    s.inK = 0.02 + 0.38 * Math.pow(smoother(c01(t / T_TOUCH)), 1.6);
  }
  if (t >= T_PUSH){
    const q = c01((t - T_PUSH) / (T_PART - T_PUSH));
    const d = t > T_PART ? mix(apart, RING, easeIO(c01((t - T_PART) / (1 - T_PART))))
                         : mix(R0 * 0.55, apart, easeIO(q));
    s.outPos = outD.map((x) => x * d);
    s.outR = RB * easeIO(Math.min(1, q * 1.3));
    s.outK = t > T_PART ? 0.02 : 0.02 + 0.42 * Math.pow(1 - q, 1.35);
    s.outDist = d;
  }

  // the ring itself: the arriving slot is empty once it has left, the
  // departing slot is empty until its drop gets back
  for (let k = 0; k < N; k++){
    const dir = slotDir(k, spin);
    let r = ORB_R, dist = RING;
    if (k === IN_SLOT){ if (t < T_TOUCH){ r = RB * 1.0; dist = s.inDist; } else r = 0; }
    if (k === OUT_SLOT){ r = t > T_PART ? RB : 0; dist = s.outDist || RING; }
    s.orbs.push(dir.map((x) => x * dist));
    s.orbR.push(r);
  }
  s.hot = t < T_TOUCH ? IN_SLOT : -1;
  return s;
}

const VARIANTS = [
  {
    key: 'fixed', name: 'Fixed', tag: 'A · as shipped',
    desc: 'The front contracts onto the departing slot, sampled where it '
        + 'happens to be. Over one exchange that anchor moves six degrees '
        + 'while the change crosses a hundred and ten, so nothing about the '
        + 'change refers to the ring going past it.',
    front(t, s, spin){
      if (t < T_TOUCH) return null;
      const f = easeIO(c01((t - T_TOUCH) / 0.62));
      const d = s.outR > 0 ? s.outDist : R0;
      return { c: s.outD.map((x) => x * d), r: mix(R0 * 2.3, Math.max(s.outR, 0.02) * 1.06, f) };
    },
  },
  {
    key: 'between', name: 'Between the orbs', tag: 'B · live endpoints',
    desc: 'The front sits on the arc between the two orbs and slides along it '
        + 'as the change proceeds, taking its endpoints from where they are '
        + 'this frame rather than where they were at the click. It starts over '
        + 'the one that arrived and ends over the one that leaves.',
    front(t, s, spin){
      if (t < T_TOUCH) return null;
      const f = easeIO(c01((t - T_TOUCH) / 0.62));
      const dir = slerp(s.inD, s.outD, f);
      const d = mix(R0, s.outR > 0 ? s.outDist : R0, f);
      return { c: dir.map((x) => x * d), r: mix(R0 * 2.3, Math.max(s.outR, 0.02) * 1.06, f) };
    },
  },
  {
    key: 'wake', name: 'Wake', tag: 'C · behind the arrival',
    desc: 'The new material fills in along the path the arriving orb took, so '
        + 'the old is pushed away from where the drop came from rather than '
        + 'pulled toward where the other one will leave. The front trails the '
        + 'arrival like a wake.',
    front(t, s, spin){
      if (t < T_TOUCH) return null;
      const f = easeIO(c01((t - T_TOUCH) / 0.62));
      // grows out of the entry point instead of shrinking onto the exit, so
      // the old material is what is left over rather than what is gathered
      const anti = s.inD.map((x) => -x);
      const dir = slerp(anti, s.outD, f * 0.65);
      return { c: dir.map((x) => x * R0 * (1.0 + 1.3 * f)),
               r: mix(R0 * 3.1, Math.max(s.outR, 0.02) * 1.06, f) };
    },
  },
  {
    key: 'spun', name: 'Spun', tag: 'D · carried round',
    desc: 'The front travels the whole arc in the ring’s own direction, '
        + 'passing under every slot between the two, as though the ring were '
        + 'dragging it round. It cannot go at the ring’s rate, which would '
        + 'take twenty-two seconds, but it goes the way the ring goes.',
    front(t, s, spin){
      if (t < T_TOUCH) return null;
      const f = easeIO(c01((t - T_TOUCH) / 0.62));
      // the long way round, in the direction the ring turns
      const steps = 4;
      let dir = s.inD;
      const total = f * (N - 2);
      const whole = Math.floor(total);
      const a = slotDir(IN_SLOT + whole, spin), b = slotDir(IN_SLOT + whole + 1, spin);
      dir = slerp(a, b, total - whole);
      const d = mix(R0, s.outR > 0 ? s.outDist : R0, f);
      return { c: dir.map((x) => x * d), r: mix(R0 * 2.3, Math.max(s.outR, 0.02) * 1.06, f) };
    },
  },
];

/* ── gl ──────────────────────────────────────────────────────────────── */

const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl){ document.getElementById('err').style.display = 'grid'; throw new Error('no webgl2'); }
function fail(m){ const e = document.getElementById('err'); e.style.display = 'grid';
                  e.textContent = m; window.__labError = m; throw new Error(m); }
function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) fail(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray());

const U = {};
for (const n of ['uTile','uHostR','uInPos','uInR','uInK','uOutPos','uOutR','uOutK',
                 'uFrontC','uFrontR','uHot']) U[n] = gl.getUniformLocation(prog, n);
U.uOrb = gl.getUniformLocation(prog, 'uOrb[0]');
U.uOrbR = gl.getUniformLocation(prog, 'uOrbR[0]');

/* ── layout ──────────────────────────────────────────────────────────── */

const STRIP_T = [0.20, 0.34, 0.50, 0.66, 0.84];
let focus = -1, strip = false;
const els = VARIANTS.map((v, i) => {
  const d = document.createElement('div');
  d.className = 'tile';
  d.innerHTML = `<div class="tag">${v.tag}</div><div class="name">${v.name}</div>`
              + `<div class="desc">${v.desc}</div><div class="bar"><i></i></div>`;
  d.onclick = () => setFocus(focus === i ? -1 : i);
  document.body.appendChild(d);
  return d;
});
const bars = els.map((e) => e.querySelector('.bar i'));
function setFocus(i){ focus = i; strip = false; sync(); }
function soloStrip(i, times){
  if (times && times.length){ STRIP_T.length = 0; STRIP_T.push(...times); }
  focus = i; strip = true; sync();
}
function sync(){
  els.forEach((e, n) => {
    e.classList.toggle('focus', n === focus);
    e.classList.toggle('row', strip);
    e.style.display = (focus < 0 || n === focus) ? 'block' : 'none';
  });
  layout();
}
let rects = [];
function layout(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight - 40;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  rects = [];
  if (strip && focus >= 0){
    rects[focus] = { x: 132, y: 0, w: W - 132, h: H };
    Object.assign(els[focus].style, { left: '0px', top: '0px', width: W + 'px', height: H + 'px' });
  } else if (strip){
    const rh = H / VARIANTS.length;
    VARIANTS.forEach((_, i) => {
      rects[i] = { x: 132, y: i * rh, w: W - 132, h: rh };
      Object.assign(els[i].style, { left: '0px', top: (i * rh) + 'px', width: W + 'px', height: rh + 'px' });
    });
  } else if (focus >= 0){
    rects[focus] = { x: 0, y: 0, w: W, h: H };
    Object.assign(els[focus].style, { left: '0px', top: '0px', width: W + 'px', height: H + 'px' });
  } else {
    const cols = W < 900 ? 1 : 2;
    const rows = Math.ceil(VARIANTS.length / cols);
    const cw = W / cols, ch = H / rows;
    VARIANTS.forEach((_, i) => {
      rects[i] = { x: (i % cols) * cw, y: Math.floor(i / cols) * ch, w: cw, h: ch };
      Object.assign(els[i].style, { left: rects[i].x + 'px', top: rects[i].y + 'px',
                                    width: cw + 'px', height: ch + 'px' });
    });
  }
  window.__dpr = dpr;
}
addEventListener('resize', layout);
sync();

/* ── loop ────────────────────────────────────────────────────────────── */

const LOOP = 4.4, HOLD = 1.0;
let clock = 0, speed = 1, paused = false, last = performance.now();
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= String(VARIANTS.length)) setFocus(+k - 1);
  else if (k === '0' || k === 'escape'){ strip = false; setFocus(-1); }
  else if (k === 'f'){ strip = !strip; sync(); }
  else if (k === 'r') clock = 0;
  else if (k === ' '){ paused = !paused; e.preventDefault(); }
  else if (k === 's') speed = speed === 1 ? 0.3 : 1;
});

const OP = new Float32Array(18), OR = new Float32Array(6);

function draw(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) clock += dt * speed;
  const t = c01((clock % (LOOP + HOLD)) / LOOP);

  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(0.027, 0.035, 0.039, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.SCISSOR_TEST);

  const dpr = window.__dpr;
  const cells = [];
  VARIANTS.forEach((v, i) => {
    const r = rects[i]; if (!r) return;
    if (strip){
      const cw = r.w / STRIP_T.length;
      STRIP_T.forEach((tt, j) => cells.push({ v, i, t: tt, x: r.x + j * cw, y: r.y, w: cw, h: r.h }));
    } else cells.push({ v, i, t, x: r.x, y: r.y, w: r.w, h: r.h });
  });

  cells.forEach(({ v, i, t: ct, x: rx, y: ry, w: rw, h: rh }) => {
    const x = Math.round(rx * dpr), w = Math.round(rw * dpr), h = Math.round(rh * dpr);
    const y = Math.round(cv.height - (ry + rh) * dpr);
    gl.viewport(x, y, w, h); gl.scissor(x, y, w, h);

    // the ring keeps turning at the site's rate through the whole thing
    const spin = clock * SPIN;
    const s = scene(ct, spin);
    const fr = v.front(ct, s, spin);

    for (let k = 0; k < 6; k++){
      OP[k * 3] = s.orbs[k][0]; OP[k * 3 + 1] = s.orbs[k][1]; OP[k * 3 + 2] = s.orbs[k][2];
      OR[k] = s.orbR[k];
    }
    gl.uniform4f(U.uTile, x, y, w, h);
    gl.uniform1f(U.uHostR, R0);
    gl.uniform3f(U.uInPos, ...s.inPos);
    gl.uniform1f(U.uInR, s.inR);
    gl.uniform1f(U.uInK, s.inK);
    gl.uniform3f(U.uOutPos, ...s.outPos);
    gl.uniform1f(U.uOutR, s.outR);
    gl.uniform1f(U.uOutK, s.outK);
    gl.uniform3f(U.uFrontC, ...(fr ? fr.c : [0, 0, 0]));
    gl.uniform1f(U.uFrontR, fr ? fr.r : (ct < T_TOUCH ? 99.0 : 0.0));
    gl.uniform3fv(U.uOrb, OP);
    gl.uniform1fv(U.uOrbR, OR);
    gl.uniform1i(U.uHot, s.hot);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    bars[i].style.width = (strip ? 100 : t * 100) + '%';
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
window.__lab = {
  VARIANTS, setFocus, soloStrip,
  set strip(v){ strip = v; sync(); },
  get clock(){ return clock; }, set clock(v){ clock = v; },
  set paused(v){ paused = v; },
};
</script>
